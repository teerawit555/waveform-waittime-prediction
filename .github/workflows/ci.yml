name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pandas openpyxl scipy matplotlib Werkzeug

      - name: Run backend tests
        env:
          NEUROSETTLE_ADMIN_TOKEN: test-token
          MLFLOW_DISABLED: "1"
          ENABLE_TRAINING: "0"
        run: |
          python -m unittest discover -s webapp/backend/tests -p "test_*.py"

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        working-directory: webapp/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: webapp/frontend
        run: npm run test

      - name: Build frontend
        working-directory: webapp/frontend
        run: npm run build
